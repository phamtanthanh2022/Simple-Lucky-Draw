<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Zodiac Wheel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .frame {
            width: 90vw;
            max-width: 1000px;
            height: 80vh;
            max-height: 700px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            animation: frameGlow 4s infinite alternate;
        }

        @keyframes frameGlow {
            0% { border-color: rgba(255, 107, 107, 0.5); }
            50% { border-color: rgba(81, 255, 184, 0.5); }
            100% { border-color: rgba(255, 255, 255, 0.2); }
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            padding: 30px;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            color: #fff;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff6b6b, #51ffbb);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(81, 255, 184, 0.3);
        }

        select, textarea {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: #004cff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        select:focus, textarea:focus {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 15px rgba(81, 255, 184, 0.5);
        }

        textarea {
            resize: none;
            height: 150px;
        }

        button {
            padding: 12px 80px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff6b6b, #51ffbb);
            color: #1a1a2e;
            font-size: 2rem;
            font-weight: 600;
            cursor: pointer;
                width: auto;
                min-height: 0;
                border-radius: 0;
                box-shadow: none;

        button:active {
            transform: translateY(2px);
            box-shadow: 0 3px 10px rgba(81, 255, 184, 0.3);
        }

        #wheel-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #wheel {
            position: relative;
            transition: transform 10s ease-out;
        }

        .player-card {
            position: absolute;
            width: 180px;
            height: 90px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            transition: all 0.5s;
            backdrop-filter: blur(5px);
        }

        @keyframes spinGlow {
            0% { background: rgba(255, 255, 255, 0.2); }
            50% { background: rgba(81, 255, 184, 0.4); }
            100% { background: rgba(255, 255, 255, 0.2); }
        }

        @keyframes fireworks {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        .firework {
            position: absolute;
            width: 15px;
            height: 15px;
            background: radial-gradient(circle, #ff6b6b, #51ffbb, transparent);
            border-radius: 50%;
            animation: fireworks 1.2s ease-out;
            box-shadow: 0 0 10px rgba(81, 255, 184, 0.8);
        }

        #winner-frame {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(81, 255, 184, 0.3);
            animation: winnerGlow 2s infinite alternate;
            max-width: 80%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        @keyframes winnerGlow {
            0% { box-shadow: 0 0 20px rgba(255, 107, 107, 0.5); }
            100% { box-shadow: 0 0 40px rgba(81, 255, 184, 0.8); }
        }

        #winner-name {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #51ffbb);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 4px 15px rgba(81, 255, 184, 0.5);
        }

        #losers {
            margin-top: 20px;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            max-width: 80%;
        }

        :root {
            color-scheme: light;
            --ink: #19332e;
            --muted: #71817a;
            --paper: #f3f6f1;
            --panel: #ffffff;
            --line: #e4e9e3;
            --green: #2f6d54;
            --coral: #e76e52;
            --yellow: #f2c65d;
        }

        * {
            font-family: 'DM Sans', sans-serif;
        }

        body {
            display: block;
            min-height: 100vh;
            padding: 28px;
            overflow: auto;
            color: var(--ink);
            background-color: var(--paper);
            background-image: radial-gradient(#dce5db 0.8px, transparent 0.8px);
            background-size: 18px 18px;
        }

        .app-shell {
            width: min(1120px, 100%);
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            color: var(--ink);
            font-size: 1rem;
            font-weight: 700;
        }

        .brand-mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border-radius: 12px;
            background: var(--green);
            color: #fff;
            font-size: 0.8rem;
            letter-spacing: 0;
        }

        .language-control {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(300px, 0.82fr) minmax(420px, 1.18fr);
            min-height: 650px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--panel);
            box-shadow: 0 24px 70px rgba(32, 59, 47, 0.09);
        }

        .setup-panel,
        .wheel-panel {
            min-width: 0;
            padding: 42px;
        }

        .setup-panel {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            border-right: 1px solid var(--line);
        }

        .eyebrow {
            margin-bottom: 12px;
            color: var(--coral);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        h1 {
            margin: 0 0 9px;
            color: var(--ink);
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 700;
            line-height: 1.05;
            text-align: left;
            text-transform: none;
            letter-spacing: 0;
            background: none;
            -webkit-text-fill-color: currentColor;
            text-shadow: none;
        }

        .intro {
            margin-bottom: 32px;
            color: var(--muted);
            font-size: 0.94rem;
            line-height: 1.55;
        }

        .field-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 9px;
            color: var(--ink);
            font-size: 0.86rem;
            font-weight: 700;
        }

        .participant-list {
            display: grid;
            gap: 5px;
            max-height: 170px;
            margin: 10px 0 0;
            overflow-y: auto;
            list-style: none;
        }

        .participant-list:empty::before {
            padding: 5px 0;
            color: var(--muted);
            content: "Your numbered entries will appear here.";
            font-size: 0.8rem;
        }

        .participant-list li {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
            color: var(--ink);
            font-size: 0.84rem;
        }

        .participant-number {
            flex: 0 0 28px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .participant-name {
            overflow-wrap: anywhere;
        }

        .entry-count {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 500;
        }

        select,
        textarea {
            width: 100%;
            max-width: none;
            margin: 0;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fbfcfa;
            color: var(--ink);
            font-size: 0.92rem;
            outline: none;
            box-shadow: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus,
        textarea:focus {
            border-color: var(--green);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(47, 109, 84, 0.12);
        }

        select {
            width: auto;
            min-width: 130px;
            padding: 10px 34px 10px 12px;
        }

        textarea {
            min-height: 220px;
            padding: 15px;
            resize: vertical;
            line-height: 1.65;
        }

        .form-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 48px;
            margin-bottom: 20px;
        }

        .clear-button {
            width: auto;
            min-height: 0;
            padding: 6px 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none;
        }

        .clear-button:hover {
            color: var(--coral);
        }

        button {
            width: 100%;
            min-height: 54px;
            padding: 12px 20px;
            border: 0;
            border-radius: 11px;
            background: var(--coral);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(231, 110, 82, 0.2);
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            background: #d65e44;
            box-shadow: 0 11px 22px rgba(231, 110, 82, 0.25);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.48;
            box-shadow: none;
        }

        .wheel-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f9fbf8;
        }

        .wheel-heading {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .wheel-heading strong {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
        }

        .wheel-heading span {
            color: var(--muted);
            font-size: 0.78rem;
        }

        .wheel-shell {
            position: relative;
            width: min(100%, 480px);
            aspect-ratio: 1;
            padding: 12px;
            border: 1px solid #e6ebe4;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 16px 35px rgba(32, 59, 47, 0.1);
        }

        #wheel {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transform: rotate(0deg);
        }

        .pointer {
            position: absolute;
            z-index: 2;
            top: -3px;
            left: 50%;
            width: 0;
            height: 0;
            transform: translateX(-50%);
            border-right: 15px solid transparent;
            border-left: 15px solid transparent;
            border-top: 29px solid var(--ink);
            filter: drop-shadow(0 3px 2px rgba(25, 51, 46, 0.16));
        }

        .wheel-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            display: grid;
            width: 66px;
            height: 66px;
            place-items: center;
            transform: translate(-50%, -50%);
            border: 5px solid #fff;
            border-radius: 50%;
            background: var(--ink);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0;
            box-shadow: 0 2px 8px rgba(25, 51, 46, 0.22);
        }

        .result {
            width: min(100%, 480px);
            margin-top: 22px;
            padding: 17px 20px;
            border: 1px solid #e8dfc7;
            border-radius: 12px;
            background: #fffaf0;
            text-align: center;
        }

        .result[hidden] {
            display: none;
        }

        .result-label {
            margin-bottom: 3px;
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .result-index {
            display: inline-block;
            margin: 0 0 8px;
            padding: 4px 9px;
            border-radius: 999px;
            background: #f2e7ca;
            color: #745a1c;
            font-size: 0.78rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        #winner-name {
            margin: 0;
            overflow-wrap: anywhere;
            color: var(--ink);
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.35rem, 3vw, 1.8rem);
            font-weight: 700;
            background: none;
            -webkit-text-fill-color: currentColor;
            text-shadow: none;
        }

        #losers {
            max-width: none;
            margin-top: 7px;
            padding: 0;
            background: transparent;
            color: var(--muted);
            font-size: 0.8rem;
            line-height: 1.5;
        }

        @media (max-width: 800px) {
            body {
                padding: 16px;
            }

            .workspace {
                grid-template-columns: 1fr;
            }

            .setup-panel {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .setup-panel,
            .wheel-panel {
                padding: 30px;
            }

            .wheel-shell {
                width: min(100%, 430px);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .topbar {
                margin-bottom: 14px;
            }

            .language-control {
                gap: 5px;
                font-size: 0.72rem;
            }

            .language-control select {
                min-width: 0;
                max-width: 145px;
                padding-right: 25px;
            }

            .workspace {
                border-radius: 16px;
            }

            .setup-panel,
            .wheel-panel {
                padding: 23px 18px;
            }

            .intro {
                margin-bottom: 24px;
            }

            textarea {
                min-height: 165px;
            }

            .wheel-panel {
                padding-top: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <div class="brand"><span class="brand-mark">LD</span><span>Lucky Draw</span></div>
            <label class="language-control" for="language">Language <select id="language"></select></label>
        </header>
        <section class="workspace">
            <div class="setup-panel">
                <p class="eyebrow">THE DRAW ROOM</p>
                <h1 id="title"></h1>
                <p class="intro">Add your group, then let the wheel make the call.</p>
                <div class="field-heading">
                    <label for="players">Players</label>
                    <span class="entry-count"><span id="playerCount">0</span> entries</span>
                </div>
                <textarea id="players" rows="7" aria-describedby="entryHint"></textarea>
                <ol id="participantList" class="participant-list" aria-label="Numbered player entries"></ol>
                <div class="form-footer">
                    <label class="language-control" for="spinDuration">Spin time
                        <select id="spinDuration">
                            <option value="5">5 seconds</option>
                            <option value="8" selected>8 seconds</option>
                            <option value="11">11 seconds</option>
                        </select>
                    </label>
                    <button id="clearBtn" class="clear-button" type="button">Clear list</button>
                </div>
                <button id="spinBtn" type="button"></button>
                <span id="entryHint" class="entry-count" role="status" aria-live="polite">Add at least 2 names to start.</span>
            </div>
            <div class="wheel-panel">
                <div class="wheel-heading"><strong>Tonight's draw</strong><span id="wheelStatus">Waiting for names</span></div>
                <div class="wheel-shell">
                    <span class="pointer" aria-hidden="true"></span>
                    <canvas id="wheel" width="900" height="900" role="img" aria-label="Lucky draw wheel"></canvas>
                    <span class="wheel-hub" aria-hidden="true">SPIN</span>
                </div>
                <div id="result" class="result" hidden aria-live="polite">
                    <p class="result-label">The winner is</p>
                    <p id="winner-index" class="result-index"></p>
                    <p id="winner-name"></p>
                    <p id="losers"></p>
                </div>
            </div>
        </section>
    </main>

                goodLuck: "Удачи в следующий раз!",
                zodiacs: ["Овен", "Телец", "Близнецы", "Рак", "Лев", "Дева", "Весы", "Скорпион", "Стрелец", "Козерог", "Водолей", "Рыбы"],
                languages: ["Вьетнамский", "Английский", "Испанский", "Французский", "Немецкий", "Итальянский", "Португальский", "Русский", "Китайский", "Японский"]
            },
            zh: { 
                title: "幸运轮", 
                placeholder: "输入玩家姓名（每行一个）", 
                spin: "旋转", 
                restart: "重启", 
                goodLuck: "下次好运！",
                zodiacs: ["白羊座", "金牛座", "双子座", "巨蟹座", "狮子座", "处女座", "天秤座", "天蝎座", "射手座", "摩羯座", "水瓶座", "双鱼座"],
                languages: ["越南语", "英语", "西班牙语", "法语", "德语", "意大利语", "葡萄牙语", "俄语", "中文", "日语"]
            },
            ja: { 
                title: "幸運の輪", 
                placeholder: "プレイヤー名を入力（1行に1つ）", 
                spin: "回す", 
                restart: "リスタート", 
                goodLuck: "次回は幸運を！",
                zodiacs: ["牡羊座", "牡牛座", "双子座", "蟹座", "獅子座", "乙女座", "天秤座", "蠍座", "射手座", "山羊座", "水瓶座", "魚座"],
                languages: ["ベトナム語", "英語", "スペイン語", "フランス語", "ドイツ語", "イタリア語", "ポルトガル語", "ロシア語", "中国語", "日本語"]
            }
        };

        const colors = ["#e76e52", "#f2c65d", "#438c70", "#7198b8", "#d985a3", "#86ad5d", "#e89b58", "#6e75a6"];
        const canvas = document.getElementById("wheel");
        const context = canvas.getContext("2d");
        const playerInput = document.getElementById("players");
        const spinButton = document.getElementById("spinBtn");
        const result = document.getElementById("result");
        const wheelStatus = document.getElementById("wheelStatus");
        let currentLang = "vi";
        let players = [];
        let rotation = 0;
        let isSpinning = false;

        function populateLanguageMenu() {
            const languageSelect = document.getElementById("language");
            languageSelect.replaceChildren();
            Object.keys(translations).forEach((key, index) => {
                const option = document.createElement("option");
                option.value = key;
                option.textContent = translations[currentLang].languages[index];
                option.selected = key === currentLang;
                languageSelect.appendChild(option);
            });
        }

        function updateLanguage() {
            currentLang = document.getElementById("language").value;
            document.getElementById("title").textContent = translations[currentLang].title;
            playerInput.placeholder = translations[currentLang].placeholder;
            spinButton.textContent = translations[currentLang].spin;
            populateLanguageMenu();
        }

        function readPlayers() {
            return playerInput.value.split(/\r?\n/).map(name => name.trim()).filter(Boolean);
        }

        function updatePlayers() {
            players = readPlayers();
            document.getElementById("playerCount").textContent = players.length;
            const participantList = document.getElementById("participantList");
            participantList.replaceChildren();
            players.forEach((name, index) => {
                const item = document.createElement("li");
                const number = document.createElement("span");
                const playerName = document.createElement("span");
                number.className = "participant-number";
                number.textContent = String(index + 1).padStart(2, "0");
                playerName.className = "participant-name";
                playerName.textContent = name;
                item.append(number, playerName);
                participantList.appendChild(item);
            });
            spinButton.disabled = isSpinning || players.length < 2;
            document.getElementById("clearBtn").disabled = isSpinning || !playerInput.value;
            document.getElementById("entryHint").textContent = players.length < 2
                ? "Add at least 2 names to start."
                : "Each line is one entry. Duplicate names count as separate entries.";
            wheelStatus.textContent = players.length ? `${players.length} entries ready` : "Waiting for names";
            canvas.setAttribute("aria-label", players.length ? `Lucky draw wheel with ${players.length} entries` : "Empty lucky draw wheel");
            result.hidden = true;
            drawWheel();
        }

        function drawWheel() {
            const center = canvas.width / 2;
            const radius = center - 8;
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.save();
            context.translate(center, center);

            if (!players.length) {
                context.beginPath();
                context.arc(0, 0, radius, 0, Math.PI * 2);
                context.fillStyle = "#edf1eb";
                context.fill();
                context.setLineDash([7, 12]);
                context.lineWidth = 3;
                context.strokeStyle = "#cbd5ca";
                context.stroke();
                context.restore();
                return;
            }

            const slice = Math.PI * 2 / players.length;
            players.forEach((player, index) => {
                const start = -Math.PI / 2 + index * slice;
                const end = start + slice;
                context.beginPath();
                context.moveTo(0, 0);
                context.arc(0, 0, radius, start, end);
                context.closePath();
                context.fillStyle = colors[index % colors.length];
                context.fill();
                context.lineWidth = 3;
                context.strokeStyle = "rgba(255,255,255,0.82)";
                context.stroke();

                if (slice < 0.07) return;
                context.save();
                context.rotate(start + slice / 2);
                context.textAlign = "center";
                context.textBaseline = "middle";
                context.fillStyle = "#17342d";
                context.font = `700 ${Math.max(14, Math.min(25, 310 * slice))}px DM Sans, sans-serif`;
                const maxLength = Math.max(5, Math.floor(35 * slice));
                const label = player.length > maxLength ? `${player.slice(0, maxLength - 1)}…` : player;
                context.fillText(label, radius * 0.65, 0, radius * 0.48);
                context.restore();
            });

            context.restore();
        }

        function finishSpin(winnerIndex) {
            isSpinning = false;
            spinButton.disabled = players.length < 2;
            document.getElementById("clearBtn").disabled = !playerInput.value;
            wheelStatus.textContent = "Draw complete";
            document.getElementById("winner-index").textContent = `List position #${winnerIndex + 1} of ${players.length}`;
            document.getElementById("winner-name").textContent = players[winnerIndex];
            document.getElementById("losers").textContent = players
                .filter((_, index) => index !== winnerIndex)
                .join(", ");
            result.hidden = false;
        }

        function startSpin() {
            if (isSpinning || players.length < 2) return;
            isSpinning = true;
            spinButton.disabled = true;
            document.getElementById("clearBtn").disabled = true;
            playerInput.disabled = true;
            result.hidden = true;

            const winnerIndex = Math.floor(Math.random() * players.length);
            const sliceDegrees = 360 / players.length;
            const target = ((360 - (winnerIndex + 0.5) * sliceDegrees) % 360 + 360) % 360;
            const offset = (target - (rotation % 360) + 360) % 360;
            const finalRotation = rotation + 6 * 360 + offset;
            const duration = Number(document.getElementById("spinDuration").value);
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            canvas.style.transition = `transform ${reducedMotion ? 0.01 : duration}s cubic-bezier(0.12, 0.72, 0.18, 1)`;
            canvas.style.transform = `rotate(${finalRotation}deg)`;
            rotation = finalRotation;
            wheelStatus.textContent = "The wheel is spinning";
            window.setTimeout(() => {
                finishSpin(winnerIndex);
                playerInput.disabled = false;
            }, reducedMotion ? 20 : duration * 1000 + 100);
        }

        document.getElementById("language").addEventListener("change", updateLanguage);
        playerInput.addEventListener("input", updatePlayers);
        spinButton.addEventListener("click", startSpin);
        document.getElementById("clearBtn").addEventListener("click", () => {
            playerInput.value = "";
            updatePlayers();
            playerInput.focus();
        });

        populateLanguageMenu();
        updateLanguage();
        updatePlayers();
    </script>
</body>
</html>
